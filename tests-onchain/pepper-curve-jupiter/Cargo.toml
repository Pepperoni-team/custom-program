[package]
name = "pepper-curve-jupiter"
version = "0.1.0"
description = "Jupiter's Amm interface for Pepper's USDC bonding curve (pepper_curve): quotes through pepper_curve_math, the program's own arithmetic, and swaps over the program's fixed account lists."
edition = "2021"
license = "MIT"
publish = false

# Standalone: its own workspace and Cargo.lock, as the LiteSVM suites beside it, so Jupiter's interface,
# its test kit and LiteSVM 0.14 (the Solana 3 and 4 crate generation) never enter the programs'
# Cargo.lock or their `--locked` unit job (USDC curve design §10.5). The lock was seeded from the
# interface's own Cargo.lock at the pinned commit: the kit's README holds its exact versions to it
# (wincode 0.5 under LiteSVM 0.14). Its parity suite runs on the program built from this tree, by
# scripts/ci-onchain-tests.sh (docs/solana/PEPPER-CURVE-PROGRAM.md §14).
[workspace]

[dependencies]
# Jupiter's `Amm` trait at GitHub's main of 2026-10-22 (0.7.0, `FlowType` in `QuoteParams` where
# 0.6.1 had `FeeMode`; the spec's §10.5 pinned `95bd184`): `Swap::Placeholder` and the test kit exist
# only on GitHub's main, not on crates.io (whose 1.0.0-beta.0 of 2026-04-09 has neither).
jupiter-amm-interface = { git = "https://github.com/jup-ag/jupiter-amm-interface.git", rev = "70f56e0495b7c818e4c38e37b2007656892ca2a1" }
# The curve's arithmetic, the very functions the program's USDC handlers call: the quote is theirs.
pepper_curve_math = { path = "../../programs/pepper_curve_math" }
rust_decimal = "1.36"
solana-account = "4"
solana-instruction = "3.1"
solana-pubkey = { version = "4", features = ["curve25519"] }

[dev-dependencies]
jupiter-amm-test-kit = { git = "https://github.com/jup-ag/jupiter-amm-interface.git", rev = "70f56e0495b7c818e4c38e37b2007656892ca2a1" }
litesvm = "0.14"
bincode = "1.3"
# The golden vectors (programs/pepper_curve_math/vectors/curve-v1.json) and the program's committed IDL.
serde_json = "1"
solana-clock = "3.1.1"
solana-compute-budget-interface = "3"
solana-keypair = "3"
solana-signer = "3"
solana-transaction = { version = "4", features = ["wincode"] }
