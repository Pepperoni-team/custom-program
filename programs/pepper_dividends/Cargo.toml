[package]
name = "pepper_dividends"
version = "0.1.0"
description = "Pepper (pepper.fan) USDC dividends: a token's month paid in USDC against a merkle root, each holder claiming into their own USDC account"
repository = "https://github.com/Pepperoni-team/custom-program"
homepage = "https://pepper.fan"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "pepper_dividends"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1" }
