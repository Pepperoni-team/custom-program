[package]
name = "fanex_curve"
version = "0.1.0"
description = "Fanex on-chain bonding curve: strip-proof atomic creator/Fanex fee split, presale curve, creator vesting, and merkle dividend distributor. Replaces Raydium LaunchLab for the presale phase (graduation still hands off to Raydium CPMM)."
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "fanex_curve"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", features = ["metadata"] }
