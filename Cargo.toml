[workspace]
members = ["programs/*"]
resolver = "2"

# Overflow checks ON in release: this is a money-handling program; a silent
# wrap on a lamport/token amount must abort, not roll over.
# opt-level "z" + strip shrink the deployed .so (→ lower one-time deploy rent);
# overflow-checks stays ON so the size win never costs us silent wraparound.
[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
opt-level = "z"
strip = true

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
